<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TD RagBot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" id="hljs-dark-theme">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css" id="hljs-light-theme" disabled>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
<style>
  :root {
    --bg: #08090b;
    --panel: rgba(21, 24, 29, 0.85);
    --panel-2: #1a1e25;
    --border: #24282f;
    --border-soft: #1c2028;
    --text: #edeef0;
    --text-dim: #7d8592;
    --text-dimmer: #565d68;
    --accent: #ff7a3d;
    --accent-glow: rgba(255, 122, 61, 0.35);
    --accent-soft: #4a2f1e;
    --user-bubble: linear-gradient(135deg, #2c333d, #232830);
    --bot-bubble: #14171c;
    --code-bg: #23282f;
    --code-text: #ffb37a;
    --pre-bg: #0d0f13;
    --radius: 16px;
    --grad-1: rgba(255, 122, 61, 0.08);
    --grad-2: rgba(120, 130, 255, 0.05);
    --scrollbar-hover: #313742;
    --logo-1: #5aa9ff;
    --logo-2: #8ee3ff;
    --logo-glow: rgba(90, 169, 255, 0.45);
    --error: #ff5c5c;
    --error-bg: rgba(255, 92, 92, 0.1);
  }
  :root[data-theme="light"] {
    --bg: #f5f6f8;
    --panel: rgba(255, 255, 255, 0.85);
    --panel-2: #eceef2;
    --border: #dde1e8;
    --border-soft: #e4e7ec;
    --text: #1a1d22;
    --text-dim: #6b7280;
    --text-dimmer: #9aa1ab;
    --accent: #e8632a;
    --accent-glow: rgba(232, 99, 42, 0.25);
    --accent-soft: #ffe4d3;
    --user-bubble: linear-gradient(135deg, #e9ebef, #dfe2e8);
    --bot-bubble: #ffffff;
    --code-bg: #e9ebef;
    --code-text: #c1531f;
    --pre-bg: #ffffff;
    --grad-1: rgba(255, 122, 61, 0.06);
    --grad-2: rgba(120, 130, 255, 0.04);
    --scrollbar-hover: #c7ccd4;
    --logo-1: #2f7fe0;
    --logo-2: #4fc7e8;
    --logo-glow: rgba(47, 127, 224, 0.3);
    --error: #d43c3c;
    --error-bg: rgba(212, 60, 60, 0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, var(--grad-1), transparent),
      radial-gradient(ellipse 700px 500px at 100% 10%, var(--grad-2), transparent),
      var(--bg);
    color: var(--text);
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background-color 0.2s, color 0.2s;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  a, button, input, [tabindex] {
    outline-offset: 2px;
  }
  a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  header {
    padding: 16px 28px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    backdrop-filter: blur(12px);
    background: var(--panel);
    z-index: 10;
    flex-shrink: 0;
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
    cursor: pointer; background: none; border: none; padding: 0;
    font-family: inherit; text-align: left; color: inherit;
    border-radius: 10px; transition: opacity 0.15s;
    min-width: 0;
  }
  .brand:hover { opacity: 0.8; }
  .brand > div:last-child { min-width: 0; }
  .logo {
    width: 32px; height: 32px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 0 8px var(--logo-glow));
    flex-shrink: 0;
  }
  .logo svg { width: 100%; height: 100%; }
  header h1 { font-size: 15.5px; font-weight: 600; margin: 0; letter-spacing: -0.1px; white-space: nowrap; }
  header .sub { color: var(--text-dim); font-size: 12.5px; font-weight: 400; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .status {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--text-dim);
    padding: 6px 12px; border: 1px solid var(--border-soft); border-radius: 999px;
    white-space: nowrap;
  }
  .status .pulse {
    width: 7px; height: 7px; border-radius: 50%; background: #4ade80;
    box-shadow: 0 0 8px #4ade80;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  @media (prefers-reduced-motion: reduce) {
    .status .pulse { animation: none; }
  }

  #theme-toggle {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 999px;
    border: 1px solid var(--border-soft); background: var(--panel-2);
    color: var(--text-dim); cursor: pointer; transition: all 0.15s;
    flex-shrink: 0;
  }
  #theme-toggle:hover { border-color: var(--accent-glow); color: var(--text); }
  #theme-toggle svg { width: 16px; height: 16px; }
  #theme-toggle .icon-moon { display: block; }
  #theme-toggle .icon-sun { display: none; }
  :root[data-theme="light"] #theme-toggle .icon-moon { display: none; }
  :root[data-theme="light"] #theme-toggle .icon-sun { display: block; }

  .clear-btn {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 999px;
    border: 1px solid var(--border-soft); background: var(--panel-2);
    color: var(--text-dim); cursor: pointer; transition: all 0.15s;
    flex-shrink: 0;
  }
  .clear-btn:hover { border-color: var(--accent-glow); color: var(--text); }
  .clear-btn svg { width: 15px; height: 15px; }
  .clear-btn:disabled { opacity: 0.3; cursor: default; }
  .clear-btn:disabled:hover { border-color: var(--border-soft); color: var(--text-dim); }

  #chat {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 32px 28px 20px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    display: flex; flex-direction: column; gap: 8px; max-width: 82%;
    animation: rise 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .msg { animation: none; }
  }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; align-items: flex-start; width: 100%; }
  .bubble {
    padding: 13px 17px;
    border-radius: var(--radius);
    line-height: 1.6;
    font-size: 14.5px;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .msg.user .bubble { background: var(--user-bubble); border-bottom-right-radius: 5px; }
  .msg.user.failed .bubble { opacity: 0.6; border: 1px dashed var(--error); }
  .msg.bot .bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border-soft);
    border-bottom-left-radius: 5px;
    width: 100%;
  }
  .bubble p { margin: 0 0 10px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 8px 0; padding-left: 22px; }
  .bubble li { margin: 4px 0; }
  .bubble code {
    font-family: "JetBrains Mono", monospace;
    font-size: 12.8px;
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 5px;
    color: var(--code-text);
  }
  .bubble pre {
    background: var(--pre-bg) !important;
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 14px 16px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin: 10px 0;
    max-width: 100%;
  }
  .bubble pre code {
    background: transparent; padding: 0; color: inherit;
    font-size: 12.8px; line-height: 1.55;
    white-space: pre;
  }
  .bubble h1, .bubble h2, .bubble h3 { font-size: 15px; margin: 14px 0 6px; color: var(--text); }
  .bubble strong { color: var(--text); }
  .bubble table {
    display: block;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    max-width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .bubble th, .bubble td { padding: 6px 10px; border: 1px solid var(--border-soft); white-space: nowrap; }
  .cursor-blink {
    display: inline-block; width: 7px; height: 15px;
    background: var(--accent); margin-left: 2px; vertical-align: text-bottom;
    animation: blink 0.9s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .cursor-blink { animation: none; }
  }

  .error-box {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--error-bg);
    border: 1px solid var(--error);
    color: var(--error);
    padding: 12px 15px;
    border-radius: var(--radius);
    font-size: 13.5px;
    width: 100%;
  }
  .error-box .retry-btn {
    background: var(--error);
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
  }
  .error-box .retry-btn:hover { opacity: 0.85; }

  .sources {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; width: 100%;
  }
  .source-chip {
    font-size: 11px; color: var(--text-dim);
    background: var(--panel-2);
    border: 1px solid var(--border-soft);
    padding: 5px 10px; border-radius: 999px; cursor: default;
    transition: all 0.15s;
    font-weight: 500;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .source-chip .score { color: var(--accent); font-weight: 600; margin-left: 5px; }
  .source-chip:hover { border-color: var(--accent-glow); color: var(--text); background: var(--border-soft); }

  .typing-dots { display: flex; gap: 4px; padding: 6px 2px; }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--text-dimmer);
    animation: bounce 1.1s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-5px); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .typing-dots span { animation: none; opacity: 0.7; }
  }

  #input-bar { padding: 10px 28px 24px; flex-shrink: 0; }
  #input-row {
    max-width: 860px; margin: 0 auto;
    display: flex; gap: 10px; align-items: center;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 8px 8px 8px 18px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #input-row:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), 0 8px 32px rgba(0,0,0,0.15); }
  #query {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 16px; padding: 11px 0; font-family: inherit;
    min-width: 0;
  }
  #query::placeholder { color: var(--text-dimmer); }
  #send {
    background: linear-gradient(135deg, var(--accent), #e8632a);
    color: #fff; border: none; border-radius: 12px;
    padding: 11px 20px; font-weight: 600; font-size: 13.5px;
    cursor: pointer; transition: transform 0.12s, opacity 0.15s;
    font-family: inherit;
    flex-shrink: 0;
    white-space: nowrap;
  }
  #send:disabled { opacity: 0.35; cursor: default; }
  #send:not(:disabled):hover { transform: translateY(-1px); }
  #send:not(:disabled):active { transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    #send:not(:disabled):hover { transform: none; }
  }

  .empty-state {
    color: var(--text-dim); text-align: center; margin: auto;
    font-size: 14px; max-width: 420px; line-height: 1.7; padding: 0 20px;
  }
  .empty-state .big-logo {
    width: 64px; height: 64px; margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 0 18px var(--logo-glow));
  }
  .empty-state .big-logo svg { width: 100%; height: 100%; }
  .empty-state h2 { color: var(--text); font-size: 18px; margin: 0 0 8px; font-weight: 600; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; }
  .suggestion-chip {
    font-size: 12.5px; padding: 8px 14px; border-radius: 10px;
    background: var(--panel-2); border: 1px solid var(--border-soft);
    cursor: pointer; transition: all 0.15s; color: var(--text-dim);
  }
  .suggestion-chip:hover { border-color: var(--accent-glow); color: var(--text); transform: translateY(-1px); }
  @media (prefers-reduced-motion: reduce) {
    .suggestion-chip:hover { transform: none; }
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  ::-webkit-scrollbar { width: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }

  /* ---- Mobile ---- */
  @media (max-width: 640px) {
    header { padding: 12px 14px; }
    .logo { width: 26px; height: 26px; }
    header h1 { font-size: 14px; }
    header .sub { font-size: 11px; }
    .status span:not(.pulse) { display: none; }
    .status { padding: 6px 8px; }
    #theme-toggle, .clear-btn { width: 28px; height: 28px; }

    #chat { padding: 18px 14px 14px; gap: 16px; }
    .msg { max-width: 92%; }
    .bubble { padding: 11px 13px; font-size: 14px; }

    .empty-state { max-width: 320px; padding: 0 10px; }
    .empty-state .big-logo { width: 48px; height: 48px; }
    .empty-state h2 { font-size: 16px; }
    .suggestions { gap: 6px; }
    .suggestion-chip { font-size: 12px; padding: 7px 11px; }

    #input-bar { padding: 8px 12px 16px; }
    #input-row { padding: 6px 6px 6px 14px; border-radius: 16px; }
    #query { font-size: 16px; padding: 10px 0; }
    #send { padding: 10px 16px; font-size: 13px; }

    .source-chip { font-size: 10.5px; padding: 4px 8px; }
  }
</style>
</head>
<body>

<header>
  <button class="brand" id="home-btn" title="Back to start" aria-label="Go to home, clear conversation">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="var(--logo-1)"/>
            <stop offset="100%" stop-color="var(--logo-2)"/>
          </linearGradient>
        </defs>
        <line x1="10" y1="30" x2="20" y2="12" stroke="url(#logoGrad)" stroke-width="1.6" opacity="0.7"/>
        <line x1="20" y1="12" x2="31" y2="18" stroke="url(#logoGrad)" stroke-width="1.6" opacity="0.7"/>
        <line x1="20" y1="12" x2="14" y2="8" stroke="url(#logoGrad)" stroke-width="1.6" opacity="0.5"/>
        <line x1="10" y1="30" x2="24" y2="33" stroke="url(#logoGrad)" stroke-width="1.6" opacity="0.5"/>
        <line x1="31" y1="18" x2="24" y2="33" stroke="url(#logoGrad)" stroke-width="1.6" opacity="0.6"/>
        <circle cx="20" cy="12" r="4" fill="url(#logoGrad)"/>
        <circle cx="10" cy="30" r="3" fill="url(#logoGrad)" opacity="0.85"/>
        <circle cx="31" cy="18" r="3.2" fill="url(#logoGrad)" opacity="0.9"/>
        <circle cx="14" cy="8" r="1.8" fill="url(#logoGrad)" opacity="0.6"/>
        <circle cx="24" cy="33" r="2.2" fill="url(#logoGrad)" opacity="0.7"/>
      </svg>
    </div>
    <div>
      <h1>TD RagBot</h1>
      <div class="sub">TouchDesigner docs · answered anywhere</div>
    </div>
  </button>
  <div class="header-right">
    <div class="status"><span class="pulse" aria-hidden="true"></span><span>gpt-oss-20b · cloud</span></div>
    <button class="clear-btn" id="clear-btn" title="Clear conversation" aria-label="Clear conversation" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
    </button>
    <button id="theme-toggle" title="Toggle light/dark theme" aria-label="Toggle light and dark theme" aria-pressed="false">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>
  </div>
</header>

<div id="chat" role="log" aria-live="polite" aria-label="Conversation">
  <div class="empty-state" id="empty-state">
    <div class="big-logo" aria-hidden="true">
      <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="logoGradBig" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="var(--logo-1)"/>
            <stop offset="100%" stop-color="var(--logo-2)"/>
          </linearGradient>
        </defs>
        <line x1="10" y1="30" x2="20" y2="12" stroke="url(#logoGradBig)" stroke-width="1.6" opacity="0.7"/>
        <line x1="20" y1="12" x2="31" y2="18" stroke="url(#logoGradBig)" stroke-width="1.6" opacity="0.7"/>
        <line x1="20" y1="12" x2="14" y2="8" stroke="url(#logoGradBig)" stroke-width="1.6" opacity="0.5"/>
        <line x1="10" y1="30" x2="24" y2="33" stroke="url(#logoGradBig)" stroke-width="1.6" opacity="0.5"/>
        <line x1="31" y1="18" x2="24" y2="33" stroke="url(#logoGradBig)" stroke-width="1.6" opacity="0.6"/>
        <circle cx="20" cy="12" r="4" fill="url(#logoGradBig)"/>
        <circle cx="10" cy="30" r="3" fill="url(#logoGradBig)" opacity="0.85"/>
        <circle cx="31" cy="18" r="3.2" fill="url(#logoGradBig)" opacity="0.9"/>
        <circle cx="14" cy="8" r="1.8" fill="url(#logoGradBig)" opacity="0.6"/>
        <circle cx="24" cy="33" r="2.2" fill="url(#logoGradBig)" opacity="0.7"/>
      </svg>
    </div>
    <h2>Ask about TouchDesigner</h2>
    Hybrid retrieval over the real docs, grounded generation via Groq. Ask from anywhere.
    <div class="suggestions">
      <button class="suggestion-chip" data-q="How do I navigate the network editor?">Navigate the network editor</button>
      <button class="suggestion-chip" data-q="What is the OP Create Dialog?">OP Create Dialog</button>
      <button class="suggestion-chip" data-q="How do I set preferences?">Set preferences</button>
    </div>
  </div>
</div>

<div id="input-bar">
  <form id="input-row" role="search">
    <label for="query" class="sr-only">Ask a question about TouchDesigner</label>
    <input id="query" type="text" placeholder="Ask about TouchDesigner... (Ctrl+K to focus)" autofocus autocomplete="off" />
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
// --- Theme handling ---
const THEME_KEY = "td-ragbot-theme";
const root = document.documentElement;
const hljsDark = document.getElementById("hljs-dark-theme");
const hljsLight = document.getElementById("hljs-light-theme");
const themeToggle = document.getElementById("theme-toggle");

function applyTheme(theme) {
  if (theme === "light") {
    root.setAttribute("data-theme", "light");
    hljsDark.disabled = true;
    hljsLight.disabled = false;
    themeToggle.setAttribute("aria-pressed", "true");
  } else {
    root.removeAttribute("data-theme");
    hljsDark.disabled = false;
    hljsLight.disabled = true;
    themeToggle.setAttribute("aria-pressed", "false");
  }
}

let savedTheme = "dark";
try {
  savedTheme = localStorage.getItem(THEME_KEY) || "dark";
} catch (e) { /* localStorage unavailable - default to dark */ }
applyTheme(savedTheme);

themeToggle.addEventListener("click", () => {
  const current = root.getAttribute("data-theme") === "light" ? "light" : "dark";
  const next = current === "light" ? "dark" : "light";
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* ignore */ }
});

// --- Chat logic ---
marked.setOptions({
  highlight: function (code, lang) {
    if (lang && hljs.getLanguage(lang)) {
      return hljs.highlight(code, { language: lang }).value;
    }
    return hljs.highlightAuto(code).value;
  }
});

const chat = document.getElementById("chat");
let emptyState = document.getElementById("empty-state");
const queryInput = document.getElementById("query");
const sendBtn = document.getElementById("send");
const inputForm = document.getElementById("input-row");
const clearBtn = document.getElementById("clear-btn");

// In-memory conversation history (multi-turn). No database - lives only
// in this browser tab, sent in full (capped server-side) with each
// request so the model can understand follow-up questions.
let conversationHistory = [];

function updateClearBtnState() {
  clearBtn.disabled = conversationHistory.length === 0;
}

const EMPTY_STATE_HTML = `
  <div class="big-logo" aria-hidden="true">
    <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="logoGradBig2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="var(--logo-1)"/>
          <stop offset="100%" stop-color="var(--logo-2)"/>
        </linearGradient>
      </defs>
      <line x1="10" y1="30" x2="20" y2="12" stroke="url(#logoGradBig2)" stroke-width="1.6" opacity="0.7"/>
      <line x1="20" y1="12" x2="31" y2="18" stroke="url(#logoGradBig2)" stroke-width="1.6" opacity="0.7"/>
      <line x1="20" y1="12" x2="14" y2="8" stroke="url(#logoGradBig2)" stroke-width="1.6" opacity="0.5"/>
      <line x1="10" y1="30" x2="24" y2="33" stroke="url(#logoGradBig2)" stroke-width="1.6" opacity="0.5"/>
      <line x1="31" y1="18" x2="24" y2="33" stroke="url(#logoGradBig2)" stroke-width="1.6" opacity="0.6"/>
      <circle cx="20" cy="12" r="4" fill="url(#logoGradBig2)"/>
      <circle cx="10" cy="30" r="3" fill="url(#logoGradBig2)" opacity="0.85"/>
      <circle cx="31" cy="18" r="3.2" fill="url(#logoGradBig2)" opacity="0.9"/>
      <circle cx="14" cy="8" r="1.8" fill="url(#logoGradBig2)" opacity="0.6"/>
      <circle cx="24" cy="33" r="2.2" fill="url(#logoGradBig2)" opacity="0.7"/>
    </svg>
  </div>
  <h2>Ask about TouchDesigner</h2>
  Hybrid retrieval over the real docs, grounded generation via Groq. Ask from anywhere.
  <div class="suggestions">
    <button class="suggestion-chip" data-q="How do I navigate the network editor?">Navigate the network editor</button>
    <button class="suggestion-chip" data-q="What is the OP Create Dialog?">OP Create Dialog</button>
    <button class="suggestion-chip" data-q="How do I set preferences?">Set preferences</button>
  </div>
`;

function bindSuggestionChips() {
  document.querySelectorAll(".suggestion-chip").forEach(chip => {
    chip.addEventListener("click", () => sendQuery(chip.dataset.q));
  });
}

function clearEmptyState() {
  if (emptyState && emptyState.parentNode) emptyState.remove();
  emptyState = null;
}

function goHome() {
  chat.innerHTML = "";
  conversationHistory = [];
  updateClearBtnState();
  const div = document.createElement("div");
  div.className = "empty-state";
  div.id = "empty-state";
  div.innerHTML = EMPTY_STATE_HTML;
  chat.appendChild(div);
  emptyState = div;
  bindSuggestionChips();
  queryInput.value = "";
  queryInput.focus();
}

document.getElementById("home-btn").addEventListener("click", goHome);
clearBtn.addEventListener("click", () => {
  if (!clearBtn.disabled) goHome();
});

function addUserMessage(text) {
  clearEmptyState();
  const msg = document.createElement("div");
  msg.className = "msg user";
  msg.innerHTML = `<div class="bubble"></div>`;
  msg.querySelector(".bubble").textContent = text;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return msg;
}

function addBotMessage() {
  clearEmptyState();
  const msg = document.createElement("div");
  msg.className = "msg bot";
  msg.innerHTML = `<div class="bubble"><div class="typing-dots" role="status" aria-label="Retrieving relevant documentation"><span></span><span></span><span></span></div></div>`;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return msg;
}

function renderSources(msgEl, sources) {
  if (!sources || sources.length === 0) return;
  const wrap = document.createElement("div");
  wrap.className = "sources";
  sources.forEach(s => {
    const chip = document.createElement("span");
    chip.className = "source-chip";
    chip.title = s.source;
    chip.innerHTML = `${s.header_title} <span style="opacity:0.6">· ${s.doc_category}</span><span class="score">${s.score}</span>`;
    wrap.appendChild(chip);
  });
  msgEl.appendChild(wrap);
}

function showRetryableError(userMsgEl, botMsgEl, query) {
  // Rollback UI: mark the optimistically-shown user message as failed,
  // remove the empty bot placeholder, and offer a one-click retry
  // instead of forcing the user to retype the question.
  userMsgEl.classList.add("failed");
  botMsgEl.remove();

  const errMsg = document.createElement("div");
  errMsg.className = "msg bot";
  errMsg.innerHTML = `
    <div class="error-box" role="alert">
      <span>Couldn't reach the server. Check your connection and try again.</span>
      <button class="retry-btn" type="button">Retry</button>
    </div>
  `;
  errMsg.querySelector(".retry-btn").addEventListener("click", () => {
    userMsgEl.remove();
    errMsg.remove();
    sendQuery(query);
  });
  chat.appendChild(errMsg);
  chat.scrollTop = chat.scrollHeight;
}

async function sendQuery(text) {
  const query = (text !== undefined ? text : queryInput.value).trim();
  if (!query) return;

  // Optimistic UI: the user's message renders immediately, before the
  // server has responded at all. If the request fails, it's visually
  // rolled back (dimmed + dashed border) with a retry action, rather
  // than silently leaving a message that was never actually sent.
  const userMsg = addUserMessage(query);
  queryInput.value = "";
  sendBtn.disabled = true;

  const botMsg = addBotMessage();
  const bubble = botMsg.querySelector(".bubble");
  let accumulated = "";
  let sourcesRendered = false;
  let gotAnyResponse = false;

  // Send the conversation so far (before this turn) as history - the
  // new question is sent separately as `query`.
  const historyToSend = conversationHistory;

  try {
    const res = await fetch("/api/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, top_k: 5, history: historyToSend }),
    });

    if (!res.ok) throw new Error(`Server returned ${res.status}`);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      gotAnyResponse = true;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split("\n\n");
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const payload = JSON.parse(line.slice(6));

        if (payload.type === "sources" && !sourcesRendered) {
          sourcesRendered = true;
        } else if (payload.type === "delta") {
          if (accumulated === "") bubble.innerHTML = "";
          accumulated += payload.text;
          bubble.innerHTML = marked.parse(accumulated) + '<span class="cursor-blink" aria-hidden="true"></span>';
          chat.scrollTop = chat.scrollHeight;
        } else if (payload.type === "error") {
          bubble.textContent = payload.text;
        } else if (payload.type === "done") {
          bubble.innerHTML = marked.parse(accumulated);
          if (payload.sources) renderSources(botMsg, payload.sources);
        }

        if (payload.type === "sources") {
          botMsg.dataset.pendingSources = JSON.stringify(payload.sources);
        }
        if (payload.type === "done" && botMsg.dataset.pendingSources) {
          renderSources(botMsg, JSON.parse(botMsg.dataset.pendingSources));
        }
      }
    }

    // Only commit this turn to history once it genuinely succeeded -
    // an empty/failed answer shouldn't poison future context.
    if (accumulated) {
      conversationHistory.push({ role: "user", content: query });
      conversationHistory.push({ role: "assistant", content: accumulated });
      updateClearBtnState();
    }
  } catch (err) {
    if (!gotAnyResponse) {
      // Never even connected - roll back the optimistic message.
      showRetryableError(userMsg, botMsg, query);
    } else {
      // Partial stream then a failure - keep what we have, note the error.
      bubble.innerHTML += `<div class="error-box" role="alert" style="margin-top:8px">Connection dropped mid-response.</div>`;
    }
  } finally {
    sendBtn.disabled = false;
    queryInput.focus();
  }
}

inputForm.addEventListener("submit", (e) => {
  e.preventDefault();
  sendQuery();
});
bindSuggestionChips();

// --- Keyboard shortcuts ---
document.addEventListener("keydown", (e) => {
  const isMod = e.metaKey || e.ctrlKey;
  if (isMod && e.key.toLowerCase() === "k") {
    e.preventDefault();
    queryInput.focus();
    queryInput.select();
  } else if (e.key === "Escape" && document.activeElement === queryInput) {
    queryInput.value = "";
  }
});
</script>
