<body>

<header>
  <button class="brand" id="home-btn" title="Back to start" aria-label="Go to home, clear conversation">
    <div class="logo" id="header-logo" aria-hidden="true">
      <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="var(--logo-1)"/>
            <stop offset="100%" stop-color="var(--logo-2)"/>
          </linearGradient>
        </defs>
        <line x1="10" y1="30" x2="20" y2="12" stroke="url(#logoGrad)" stroke-width="1.6" opacity="0.7"/>
        <line x1="20" y1="12" x2="31" y2="18" stroke="url(#logoGrad)" stroke-width="1.6" opacity="0.7"/>
        <line x1="20" y1="12" x2="14" y2="8" stroke="url(#logoGrad)" stroke-width="1.6" opacity="0.5"/>
        <line x1="10" y1="30" x2="24" y2="33" stroke="url(#logoGrad)" stroke-width="1.6" opacity="0.5"/>
        <line x1="31" y1="18" x2="24" y2="33" stroke="url(#logoGrad)" stroke-width="1.6" opacity="0.6"/>
        <circle cx="20" cy="12" r="4" fill="url(#logoGrad)"/>
        <circle cx="10" cy="30" r="3" fill="url(#logoGrad)" opacity="0.85"/>
        <circle cx="31" cy="18" r="3.2" fill="url(#logoGrad)" opacity="0.9"/>
        <circle cx="14" cy="8" r="1.8" fill="url(#logoGrad)" opacity="0.6"/>
        <circle cx="24" cy="33" r="2.2" fill="url(#logoGrad)" opacity="0.7"/>
      </svg>
      <img id="header-logo-img" alt="" />
    </div>
    <div>
      <h1>TD RagBot</h1>
      <div class="sub">TouchDesigner docs · answered anywhere</div>
    </div>
  </button>
  <div class="header-right">
    <a class="nav-link" href="/about">About</a>
    <div class="status"><span class="pulse" aria-hidden="true"></span><span>gpt-oss-20b · cloud</span></div>
    <button class="clear-btn" id="clear-btn" title="Clear conversation" aria-label="Clear conversation" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
    </button>
    <button id="theme-toggle" title="Toggle light/dark theme" aria-label="Toggle light and dark theme" aria-pressed="false">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>
  </div>
</header>

<div class="stats-bar" id="stats-bar" hidden aria-live="off">
  <div class="ticker-track" id="ticker-track">
    <div class="ticker-group" id="ticker-group-1"></div>
    <div class="ticker-group" id="ticker-group-2" aria-hidden="true"></div>
  </div>
</div>

<div id="chat" role="log" aria-live="polite" aria-label="Conversation">
  <div class="empty-state" id="empty-state">
    <div class="hero-canvas-wrap" id="hero-canvas" aria-hidden="true"></div>
    <h2>Ask about TouchDesigner</h2>
    Hybrid retrieval over the real docs, grounded generation via Groq. Ask from anywhere.
    <div class="suggestions">
      <button class="suggestion-chip" data-q="How do I navigate the network editor?">Navigate the network editor</button>
      <button class="suggestion-chip" data-q="What is the OP Create Dialog?">OP Create Dialog</button>
      <button class="suggestion-chip" data-q="How do I set preferences?">Set preferences</button>
    </div>
  </div>
</div>

<div id="input-bar">
  <form id="input-row" role="search">
    <label for="query" class="sr-only">Ask a question about TouchDesigner</label>
    <input id="query" type="text" placeholder="Ask about TouchDesigner... (Ctrl+K to focus)" autofocus autocomplete="off" />
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
initTheme();

// --- Corpus stats ticker (real data from Qdrant via /api/stats) ---
function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function renderMarkdown(text) {
  if (window.DOMPurify && typeof marked.parse === "function") {
    return DOMPurify.sanitize(marked.parse(text || ""));
  }
  return `<pre>${escapeHtml(text || "")}</pre>`;
}

function buildStatChips(data) {
  const chips = [];
  chips.push(`<span class="stat-chip"><strong>${Number(data.chunk_count).toLocaleString()}</strong> chunks indexed</span>`);
  if (data.source_file_count) {
    const approx = data.source_file_count_is_estimate ? "~" : "";
    chips.push(`<span class="stat-chip">${approx}<strong>${Number(data.source_file_count).toLocaleString()}</strong> source files</span>`);
  }
  if (data.categories && data.categories.length > 0) {
    chips.push(`<span class="stat-chip">${escapeHtml(data.categories.join(" · "))}</span>`);
  }
  if (data.embedding_model) {
    chips.push(`<span class="stat-chip">${escapeHtml(data.embedding_model)}</span>`);
  }
  if (data.status) {
    const cls = data.status === "green" ? " status-green" : "";
    chips.push(`<span class="stat-chip${cls}">Qdrant: <strong>${escapeHtml(data.status)}</strong></span>`);
  }
  return chips.join("");
}

async function loadStats() {
  try {
    const res = await fetch("/api/stats");
    const data = await res.json();
    if (data.chunk_count == null) return; // fail silently, non-critical

    const bar = document.getElementById("stats-bar");
    const html = buildStatChips(data);
    document.getElementById("ticker-group-1").innerHTML = html;
    document.getElementById("ticker-group-2").innerHTML = html;
    bar.hidden = false;
  } catch (e) {
    // Stats are decorative, not essential - never block the app on this.
  }
}
loadStats();

// --- Chat logic ---
marked.setOptions({
  highlight: function (code, lang) {
    if (lang && hljs.getLanguage(lang)) {
      return hljs.highlight(code, { language: lang }).value;
    }
    return hljs.highlightAuto(code).value;
  }
});

const chat = document.getElementById("chat");
let emptyState = document.getElementById("empty-state");
const queryInput = document.getElementById("query");
const sendBtn = document.getElementById("send");
const inputForm = document.getElementById("input-row");
const clearBtn = document.getElementById("clear-btn");

// In-memory conversation history (multi-turn). No database - lives only
// in this browser tab, sent in full (capped server-side) with each
// request so the model can understand follow-up questions.
let conversationHistory = [];

function updateClearBtnState() {
  clearBtn.disabled = conversationHistory.length === 0;
}

const EMPTY_STATE_HTML = `
  <div class="hero-canvas-wrap" id="hero-canvas" aria-hidden="true"></div>
  <h2>Ask about TouchDesigner</h2>
  Hybrid retrieval over the real docs, grounded generation via Groq. Ask from anywhere.
  <div class="suggestions">
    <button class="suggestion-chip" data-q="How do I navigate the network editor?">Navigate the network editor</button>
    <button class="suggestion-chip" data-q="What is the OP Create Dialog?">OP Create Dialog</button>
    <button class="suggestion-chip" data-q="How do I set preferences?">Set preferences</button>
  </div>
`;

function bindSuggestionChips() {
  document.querySelectorAll(".suggestion-chip").forEach(chip => {
    chip.addEventListener("click", () => sendQuery(chip.dataset.q));
  });
}

function clearEmptyState() {
  if (emptyState && emptyState.parentNode) {
    stopHeroAnimation();
    emptyState.remove();
  }
  emptyState = null;
}

function goHome() {
  stopHeroAnimation();
  chat.innerHTML = "";
  conversationHistory = [];
  updateClearBtnState();
  const div = document.createElement("div");
  div.className = "empty-state";
  div.id = "empty-state";
  div.innerHTML = EMPTY_STATE_HTML;
  chat.appendChild(div);
  emptyState = div;
  bindSuggestionChips();
  initHeroAnimation();
  queryInput.value = "";
  queryInput.focus();
}

document.getElementById("home-btn").addEventListener("click", goHome);
clearBtn.addEventListener("click", () => {
  if (!clearBtn.disabled) goHome();
});

function addUserMessage(text) {
  clearEmptyState();
  const msg = document.createElement("div");
  msg.className = "msg user";
  msg.innerHTML = `<div class="bubble"></div>`;
  msg.querySelector(".bubble").textContent = text;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return msg;
}

function addBotMessage() {
  clearEmptyState();
  const msg = document.createElement("div");
  msg.className = "msg bot";
  msg.innerHTML = `<div class="bubble"><div class="typing-dots" role="status" aria-label="Retrieving relevant documentation"><span></span><span></span><span></span></div></div>`;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return msg;
}

function renderSources(msgEl, sources) {
  if (!sources || sources.length === 0) return;
  if (msgEl.querySelector(".sources")) return;
  const wrap = document.createElement("div");
  wrap.className = "sources";
  sources.forEach(s => {
    const chip = document.createElement("span");
    chip.className = "source-chip";
    chip.title = String(s.source ?? "");
    chip.appendChild(document.createTextNode(s.header_title ?? ""));
    const cat = document.createElement("span");
    cat.style.opacity = "0.6";
    cat.textContent = ` · ${s.doc_category ?? ""}`;
    const score = document.createElement("span");
    score.className = "score";
    score.textContent = String(s.score ?? "");
    chip.append(cat, score);
    wrap.appendChild(chip);
  });
  msgEl.appendChild(wrap);
}

function showRetryableError(userMsgEl, botMsgEl, query) {
  userMsgEl.classList.add("failed");
  botMsgEl.remove();

  const errMsg = document.createElement("div");
  errMsg.className = "msg bot";
  errMsg.innerHTML = `
    <div class="error-box" role="alert">
      <span>Couldn't reach the server. Check your connection and try again.</span>
      <button class="retry-btn" type="button">Retry</button>
    </div>
  `;
  errMsg.querySelector(".retry-btn").addEventListener("click", () => {
    userMsgEl.remove();
    errMsg.remove();
    sendQuery(query);
  });
  chat.appendChild(errMsg);
  chat.scrollTop = chat.scrollHeight;
}

async function sendQuery(text) {
  const query = (text !== undefined ? text : queryInput.value).trim();
  if (!query) return;

  const userMsg = addUserMessage(query);
  queryInput.value = "";
  sendBtn.disabled = true;

  const botMsg = addBotMessage();
  const bubble = botMsg.querySelector(".bubble");
  let accumulated = "";
  let sourcesRendered = false;
  let gotAnyResponse = false;

  const historyToSend = conversationHistory;

  try {
    const res = await fetch("/api/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, top_k: 5, history: historyToSend }),
    });

    if (!res.ok) throw new Error(`Server returned ${res.status}`);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      gotAnyResponse = true;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split("\n\n");
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const payload = JSON.parse(line.slice(6));

        if (payload.type === "sources") {
          if (!sourcesRendered) {
            sourcesRendered = true;
            renderSources(botMsg, payload.sources);
          }
        } else if (payload.type === "delta") {
          if (accumulated === "") bubble.innerHTML = "";
          accumulated += payload.text;
          bubble.innerHTML = renderMarkdown(accumulated) + '<span class="cursor-blink" aria-hidden="true"></span>';
          chat.scrollTop = chat.scrollHeight;
        } else if (payload.type === "error") {
          bubble.textContent = payload.text;
        } else if (payload.type === "done") {
          bubble.innerHTML = renderMarkdown(accumulated);
        }
      }
    }

    if (accumulated) {
      conversationHistory.push({ role: "user", content: query });
      conversationHistory.push({ role: "assistant", content: accumulated });
      updateClearBtnState();
    }
  } catch (err) {
    if (!gotAnyResponse) {
      showRetryableError(userMsg, botMsg, query);
    } else {
      bubble.innerHTML += `<div class="error-box" role="alert" style="margin-top:8px">Connection dropped mid-response.</div>`;
    }
  } finally {
    sendBtn.disabled = false;
    queryInput.focus();
  }
}

inputForm.addEventListener("submit", (e) => {
  e.preventDefault();
  sendQuery();
});
bindSuggestionChips();
initHeroAnimation();

document.addEventListener("keydown", (e) => {
  const isMod = e.metaKey || e.ctrlKey;
  if (isMod && e.key.toLowerCase() === "k") {
    e.preventDefault();
    queryInput.focus();
    queryInput.select();
  } else if (e.key === "Escape" && document.activeElement === queryInput) {
    queryInput.value = "";
  }
});
</script>

</body>
</html>
